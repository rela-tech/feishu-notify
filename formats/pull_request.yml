title: "{{>prefix}}触发了 PR{{>number}} 事件（{{action}}）"
body: |
  {{#actor}}
  操作人：{{actor}}
  {{/actor}}
  {{#subject}}
  标题：{{subject}}
  {{/subject}}
button: 在 GitHub 查看PR
link: itemUrl
variants:
  opened:
    title: "{{>prefix}}提交了 PR{{>number}}"
    color: wathet
    body: |
      {{#actor}}
      操作人：{{actor}}
      {{/actor}}
      {{#subject}}
      标题：{{subject}}
      {{/subject}}
      {{#body}}
      正文：{{body}}
      {{/body}}
  closed:
    title: "{{>prefix}}关闭了 PR{{>number}}"
  closed.merged:
    title: "{{>prefix}}合并了 PR{{>number}}"
    color: green
  reopened:
    title: "{{>prefix}}重新打开了 PR{{>number}}"
  ready_for_review:
    title: "{{>prefix}}将 PR{{>number}} 标记为可评审"
    color: wathet
    body: |
      {{#actor}}
      操作人：{{actor}}
      {{/actor}}
      {{#subject}}
      标题：{{subject}}
      {{/subject}}
      {{#body}}
      正文：{{body}}
      {{/body}}
  review_requested:
    title: "{{>prefix}}请求评审 PR{{>number}}"
    color: wathet
    body: |
      {{#actor}}
      操作人：{{actor}}
      {{/actor}}
      {{#subject}}
      标题：{{subject}}
      {{/subject}}
      {{#reviewer}}
      请求评审：{{reviewer}}
      {{/reviewer}}
      {{#body}}
      正文：{{body}}
      {{/body}}
  edited:
    title: "{{>prefix}}编辑了 PR{{>number}}"
  synchronize:
    title: "{{>prefix}}更新了 PR{{>number}}"
